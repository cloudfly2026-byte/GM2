spring.application.name=APPAPI

# ==========================
#  DATASOURCE CON ENV VARS
# ==========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:GM2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Elian2020#}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracon del proveedor JPA (Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración del servidor Tomcat
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

# Configuración de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.resolve-lazily=true

# Configuración de JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Config de logs de seguridad
logging.level.org.springframework.security=DEBUG

# JWT (idealmente mover a env var en prod)
jwt.private.key=${JWT_PRIVATE_KEY:25025844Ewqwqw855}
jwt.user.generator=${JWT_USER_GENERATOR:EGBM}

# Rutas de almacenamiento de archivos
media.location=../media/uploads
sign.location=../media/firmas
biomedical.firma=../media/firma_soporte
document.location=../media/documents

# CORS (puedes ajustar por perfil o env)
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:https://gm2.equibiomedic.co,http://localhost:3000,https://gm2dev.equibiomedic.co}

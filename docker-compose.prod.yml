version: "3.9"

services:
  backend-spring:
    image: ghcr.io/cloudfly2026-byte/gm2/backend-spring:latest
    restart: always
    volumes:
      - ./backend/documents:/app/documents
      - ./backend/firma_soporte:/app/firma_soporte
      - ./backend/firmas/:/app/firmas
      - ./backend/images:/app/images
      - ./backend/uploads:/app/uploads
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gm2
      DB_USERNAME: root
      DB_PASSWORD: widowmaker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/gm2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: widowmaker
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      NEXT_FRONTEND_URL: https://gm2.equibiomedic.co
      CORS_ALLOWED_ORIGIN: https://gm2.equibiomedic.co
    networks:
      - kafka-net
      - mired
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.equibiomedic.co`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  gm2:
    container_name: gm2_app
    image: ghcr.io/cloudfly2026-byte/gm2/frontend:latest
    ports:
      - "3000:3000"
    restart: always
    networks:
      - mired
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gm2.rule=Host(`gm2.equibiomedic.co`)"
      - "traefik.http.routers.gm2.entrypoints=websecure"
      - "traefik.http.routers.gm2.tls.certresolver=le"
      - "traefik.http.services.gm2.loadbalancer.server.port=3000"

networks:
  kafka-net:
    external: true
    name: gm2_kafka-net
  mired:
    external: true
    name: gm2_mired
